[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
# The command is still `gcs-pypi`; the distribution name differs because `gcs-pypi` on PyPI is
# an unrelated project.
name = "gcs-pypi-proxy"
description = "Serve a GCS bucket of wheels/sdists as a local PEP 503 index for pip and uv"
authors = [{ name = "Joachim Bargsten", email = "jw@bargsten.org" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
]
# Taken from Cargo.toml.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jwbargsten/gcs-pypi"

[tool.maturin]
# Ship the compiled binary as a script, no Python module (like ruff/uv).
bindings = "bin"
