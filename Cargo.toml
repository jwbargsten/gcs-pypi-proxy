[package]
name = "gcs-pypi"
version = "0.3.0"
edition = "2024"
description = "Serve a GCS bucket of wheels/sdists as a local PEP 503 index for pip and uv"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2.191"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
rstest = "0.28.0"
